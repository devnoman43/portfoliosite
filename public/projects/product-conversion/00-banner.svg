<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E23325"/><stop offset="1" stop-color="#6FA82F"/></linearGradient>
    <radialGradient id="g1" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#6FA82F" stop-opacity="0.16"/><stop offset="1" stop-color="#6FA82F" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#E23325" stop-opacity="0.12"/><stop offset="1" stop-color="#E23325" stop-opacity="0"/></radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#17191f" flood-opacity="0.07"/></filter>
  </defs>

  <rect width="1600" height="600" fill="#FBF7EF"/>
  <circle cx="1480" cy="70" r="300" fill="url(#g1)"/>
  <circle cx="120" cy="560" r="280" fill="url(#g2)"/>

  <!-- brand + headline -->
  <rect x="80" y="48" width="38" height="38" rx="10" fill="url(#brand)"/>
  <text x="130" y="75" font-size="21" font-weight="800" fill="#17191F">Product Conversion Monitor</text>

  <text x="80" y="146" font-size="46" font-weight="800" fill="#17191F">Find the products silently losing you revenue</text>
  <text x="80" y="188" font-size="22" fill="#7a7568">Per-product conversion tracking, smart drop alerts and side-by-side comparisons &#8212; automatic, from day one.</text>

  <!-- ===== feature tiles ===== -->
  <!-- row 1 -->
  <!-- 1 Dashboard -->
  <g transform="translate(80,228)">
    <rect width="342" height="150" rx="16" fill="#fff" stroke="#eee7d8" filter="url(#sh)"/>
    <rect x="22" y="26" width="46" height="46" rx="12" fill="#17191F"/>
    <rect x="34" y="38" width="10" height="10" rx="2" fill="#fff"/><rect x="48" y="38" width="10" height="10" rx="2" fill="#fff"/>
    <rect x="34" y="52" width="10" height="10" rx="2" fill="#fff"/><rect x="48" y="52" width="10" height="10" rx="2" fill="#fff"/>
    <text x="86" y="50" font-size="19" font-weight="800" fill="#17191F">Live dashboard</text>
    <text x="86" y="78" font-size="14" fill="#7a7568">All your metrics at a glance</text>
  </g>
  <!-- 2 Alerts -->
  <g transform="translate(446,228)">
    <rect width="342" height="150" rx="16" fill="#fff" stroke="#eee7d8" filter="url(#sh)"/>
    <rect x="22" y="26" width="46" height="46" rx="12" fill="#E23325"/>
    <path d="M45 36 L59 62 L31 62 Z" fill="#fff"/><rect x="43" y="46" width="4" height="9" rx="2" fill="#E23325"/><circle cx="45" cy="58" r="2.2" fill="#E23325"/>
    <text x="86" y="50" font-size="19" font-weight="800" fill="#17191F">Drop alerts</text>
    <text x="86" y="78" font-size="14" fill="#7a7568">Real declines, not daily noise</text>
  </g>
  <!-- 3 Revenue at risk -->
  <g transform="translate(812,228)">
    <rect width="342" height="150" rx="16" fill="#fff" stroke="#eee7d8" filter="url(#sh)"/>
    <rect x="22" y="26" width="46" height="46" rx="12" fill="#C9821B"/>
    <text x="45" y="60" font-size="30" font-weight="800" fill="#fff" text-anchor="middle">$</text>
    <text x="86" y="50" font-size="19" font-weight="800" fill="#17191F">Revenue at risk</text>
    <text x="86" y="78" font-size="14" fill="#7a7568">See the money you&#8217;re losing</text>
  </g>
  <!-- 4 Health score -->
  <g transform="translate(1178,228)">
    <rect width="342" height="150" rx="16" fill="#fff" stroke="#eee7d8" filter="url(#sh)"/>
    <rect x="22" y="26" width="46" height="46" rx="12" fill="#6FA82F"/>
    <circle cx="45" cy="49" r="14" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-dasharray="66 88" transform="rotate(-90 45 49)"/>
    <text x="86" y="50" font-size="19" font-weight="800" fill="#17191F">Health score</text>
    <text x="86" y="78" font-size="14" fill="#7a7568">0&#8211;100 for every product</text>
  </g>

  <!-- row 2 -->
  <!-- 5 Insights -->
  <g transform="translate(80,398)">
    <rect width="342" height="150" rx="16" fill="#fff" stroke="#eee7d8" filter="url(#sh)"/>
    <rect x="22" y="26" width="46" height="46" rx="12" fill="#2f5fb0"/>
    <circle cx="45" cy="45" r="11" fill="#fff"/><rect x="40" y="54" width="10" height="7" rx="2" fill="#fff"/>
    <text x="86" y="50" font-size="19" font-weight="800" fill="#17191F">Plain-English insights</text>
    <text x="86" y="78" font-size="14" fill="#7a7568">Know exactly what to fix</text>
  </g>
  <!-- 6 Compare products -->
  <g transform="translate(446,398)">
    <rect width="342" height="150" rx="16" fill="#fff" stroke="#eee7d8" filter="url(#sh)"/>
    <rect x="22" y="26" width="46" height="46" rx="12" fill="#17191F"/>
    <rect x="34" y="40" width="9" height="20" rx="2" fill="#fff"/><rect x="48" y="32" width="9" height="28" rx="2" fill="#fff"/>
    <text x="86" y="50" font-size="19" font-weight="800" fill="#17191F">Compare products</text>
    <text x="86" y="78" font-size="14" fill="#7a7568">Two products head-to-head</text>
  </g>
  <!-- 7 Compare periods -->
  <g transform="translate(812,398)">
    <rect width="342" height="150" rx="16" fill="#fff" stroke="#eee7d8" filter="url(#sh)"/>
    <rect x="22" y="26" width="46" height="46" rx="12" fill="#6FA82F"/>
    <polyline points="32,60 41,50 48,55 58,38" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M58 38 l-8 0 m8 0 l0 8" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/>
    <text x="86" y="50" font-size="19" font-weight="800" fill="#17191F">Compare periods</text>
    <text x="86" y="78" font-size="14" fill="#7a7568">What changed, and why</text>
  </g>
  <!-- 8 Compare sets -->
  <g transform="translate(1178,398)">
    <rect width="342" height="150" rx="16" fill="#fff" stroke="#eee7d8" filter="url(#sh)"/>
    <rect x="22" y="26" width="46" height="46" rx="12" fill="#C9821B"/>
    <rect x="32" y="36" width="26" height="7" rx="3" fill="#fff"/><rect x="32" y="46" width="26" height="7" rx="3" fill="#fff" opacity="0.85"/><rect x="32" y="56" width="26" height="7" rx="3" fill="#fff" opacity="0.7"/>
    <text x="86" y="50" font-size="19" font-weight="800" fill="#17191F">Compare sets</text>
    <text x="86" y="78" font-size="14" fill="#7a7568">Group your lines and compare</text>
  </g>
</svg>
